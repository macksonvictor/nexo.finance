version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "javascript"
      - "security"
      - "status: needs-triage"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"

  - package-ecosystem: "pip"
    directory: "/python-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
      - "status: needs-triage"
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"
    groups:
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/nexo-ai-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:40"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
      - "status: needs-triage"
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"
    groups:
      legacy-python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      legacy-python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "security"
      - "status: needs-triage"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "10:20"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github_actions"
      - "security"
      - "status: needs-triage"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
