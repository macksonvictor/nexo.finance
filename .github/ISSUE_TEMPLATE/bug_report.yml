name: Bug report
description: Report a public, reproducible bug in Nexo Finance.
title: "bug: "
labels: ["bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not include email addresses, phone numbers, API keys, tokens, payment details, financial data, private URLs, or account screenshots in public issues.

        For security issues, use SECURITY.md. For private account or payment support, use the in-app support channel.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug in one or two sentences.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear steps so the issue can be reproduced.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard
        - Boxes
        - Goals
        - History
        - Reports / Indicators
        - NEXO AI
        - Support
        - Authentication
        - Payments
        - Python Core
        - Deployment
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Chrome on Windows, Safari on iPhone, etc.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Attach only screenshots that do not expose sensitive information.

  - type: checkboxes
    id: safety
    attributes:
      label: Public issue safety check
      options:
        - label: This issue does not include personal data, financial data, secrets, tokens, private URLs, or account screenshots.
          required: true
        - label: This is not a security vulnerability report.
          required: true
