name: Pergunta pública sobre o NEXO
description: Use somente para dúvidas públicas sem dados pessoais. Para conta, pagamento ou dados sensíveis, use a central do app.
title: "[pergunta-publica] "
labels: ["pergunta"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub é público. Não use este formulário para conta, pagamento, dados financeiros, e-mail, telefone, chaves, senhas, tokens ou prints com informações sensíveis.
        Para assunto privado, use a central de suporte dentro do app. O suporte humano profissional será conectado por uma ferramenta dedicada futuramente.
  - type: textarea
    id: duvida
    attributes:
      label: Qual é a pergunta pública?
      placeholder: Descreva a dúvida sem dados pessoais ou financeiros.
    validations:
      required: true
  - type: dropdown
    id: tema
    attributes:
      label: Tema
      options:
        - Pagamento
        - Conta
        - Caixas
        - Nexo IA
        - Bug
        - Sugestão
        - Documentação
        - Outro
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto seguro
      description: Inclua apenas informações que podem ser públicas.
    validations:
      required: false
