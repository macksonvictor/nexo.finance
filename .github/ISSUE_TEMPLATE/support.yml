name: Pergunta publica sobre o NEXO
description: Use somente para duvidas publicas sem dados pessoais. Para conta, pagamento ou dados sensiveis, use a central do app.
title: "[pergunta-publica] "
labels: ["pergunta"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub e publico. Nao use este formulario para conta, pagamento, dados financeiros, e-mail, telefone, chaves, senhas, tokens ou prints com informacoes sensiveis.
        Para assunto privado, use a central de suporte dentro do app. O suporte humano profissional sera conectado por uma ferramenta dedicada futuramente.
  - type: textarea
    id: duvida
    attributes:
      label: Qual e a pergunta publica?
      placeholder: Descreva a duvida sem dados pessoais ou financeiros.
    validations:
      required: true
  - type: dropdown
    id: tema
    attributes:
      label: Tema
      options:
        - Pagamento
        - Conta
        - Caixas
        - Nexo IA
        - Bug
        - Sugestao
        - Documentacao
        - Outro
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto seguro
      description: Inclua apenas informacoes que podem ser publicas.
    validations:
      required: false
