name: Sugestão de melhoria
description: Sugira uma melhoria para o NEXO Finance.
title: "[sugestão] "
labels: ["sugestao"]
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário para ideias de produto, UX, IA, suporte ou integrações.
  - type: textarea
    id: problema
    attributes:
      label: Qual problema essa ideia resolve?
      placeholder: Ex. Quero que o suporte sugira artigos antes de abrir WhatsApp.
    validations:
      required: true
  - type: textarea
    id: solucao
    attributes:
      label: Como você imagina a solução?
      placeholder: Descreva o comportamento ideal para o usuário.
    validations:
      required: true
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade percebida
      options:
        - Baixa
        - Média
        - Alta
        - Crítica para lançamento
    validations:
      required: false
  - type: textarea
    id: referencias
    attributes:
      label: Referências ou exemplos
      description: Links, prints ou produtos que inspiram a sugestão.
    validations:
      required: false
