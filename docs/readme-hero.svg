  <g opacity="0.25">
    <circle cx="1040" cy="260" r="6" fill="#F5F5F5"/>
    <circle cx="1060" cy="260" r="6" fill="#F5F5F5"/>
    <circle cx="1080" cy="260" r="6" fill="#F5F5F5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.4s" repeatCount="indefinite"/>
