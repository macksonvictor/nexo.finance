<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 120) rotate(90) scale(220 220)">
      <stop offset="0%" stop-color="#2D5016" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>

  <g transform="translate(120 70)">
    <g opacity="0.75">
      <rect x="0" y="0" width="200" height="200" rx="24" fill="#121212" stroke="#2E2E2E"/>
      <rect x="24" y="24" width="152" height="152" rx="18" fill="#0D0D0D" stroke="#2E2E2E"/>
    </g>

    <g transform="translate(60 56)">
      <path d="M41 3L81 26V74L41 97L1 74V26L41 3Z" stroke="#F5F5F5" stroke-width="6" fill="none"/>
      <path d="M41 3L81 26V46L41 23L1 46V26L41 3Z" stroke="#F5F5F5" stroke-width="6" fill="none"/>
      <path d="M1 46L41 69L81 46" stroke="#F5F5F5" stroke-width="6" fill="none"/>
      <circle cx="41" cy="50" r="30" stroke="#F5F5F5" stroke-width="3" opacity="0.3">
        <animate attributeName="r" values="26;36;26" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="translate(380 90)">
