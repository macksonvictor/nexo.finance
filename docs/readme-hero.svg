    </text>

    <g transform="translate(0 120)">
      <rect x="0" y="0" width="160" height="44" rx="12" fill="#F5F5F5"/>
      <text x="24" y="28" font-family="Space Grotesk, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D0D0D">
